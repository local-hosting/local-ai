nodeLinker: node-modules

enableScripts: true

npmMinimalAgeGate: 0

npmPreapprovedPackages:
  - "@local-hosting/*@*"
  - "@local-hosting/compose@0.1.0"
  - "@local-hosting/vocab@0.1.0"

approvedGitRepositories:
  - "**"

npmScopes:
  local-hosting:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAuthToken: "${YARN_NPM_AUTH_TOKEN-}"
    npmAlwaysAuth: false